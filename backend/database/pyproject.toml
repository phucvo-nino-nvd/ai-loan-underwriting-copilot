[project]
name = "aluci-database"
version = "0.1.0"
description = "Database package for Aluci with Aurora Data API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.8",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "pytest>=8.4.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
]
